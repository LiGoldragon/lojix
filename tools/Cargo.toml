[package]
name = "lojix-offline-tools"
version = "1.0.1"
edition = "2024"
rust-version = "1.89"
publish = false

[[bin]]
name = "lojix-write-configuration"
path = "src/lojix-write-configuration.rs"

[[bin]]
name = "lojix-inspect-store"
path = "src/lojix-inspect-store.rs"

[[bin]]
name = "lojix-reset-store"
path = "src/lojix-reset-store.rs"

[[bin]]
name = "lojix-migrate-configuration"
path = "src/lojix-migrate-configuration.rs"

[[bin]]
name = "lojix-bootstrap"
path = "src/lojix-bootstrap.rs"

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "99a9e8c9cbdb88650cc2511644b89428c22129e2" }
horizon-lib = { git = "https://github.com/LiGoldragon/horizon-rs", rev = "8f4240ef23024c2d3b55f803d96d3c6e7aa5b433", package = "horizon-lib" }
lojix = { path = "..", features = ["tools"] }
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
protos = { git = "https://github.com/LiGoldragon/protos", rev = "b543678cfc8609529cea7174eb4af8a64daa54ad" }
signal-lojix = { git = "https://github.com/LiGoldragon/signal-lojix", rev = "4c88a67cedccc84fd4754de4443cd87e08e740d6" }
tempfile = "3"
