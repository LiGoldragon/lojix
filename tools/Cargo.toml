[package]
name = "lojix-offline-tools"
version = "9.0.0"
edition = "2024"
rust-version = "1.89"
publish = false

[[bin]]
name = "lojix-write-configuration"
path = "src/lojix-write-configuration.rs"

[[bin]]
name = "lojix-inspect-store"
path = "src/lojix-inspect-store.rs"

[[bin]]
name = "lojix-reset-store"
path = "src/lojix-reset-store.rs"

[[bin]]
name = "lojix-migrate-configuration"
path = "src/lojix-migrate-configuration.rs"

[[bin]]
name = "lojix-bootstrap"
path = "src/lojix-bootstrap.rs"

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "4dff16b4f7412febc3b71aac8b49680cd20988cb" }
horizon-lib = { git = "https://github.com/LiGoldragon/horizon-rs", rev = "2e09ebbdc725f64fd9ee102b5758bab85be217e1", package = "horizon-lib" }
lojix = { path = "..", features = ["tools"] }
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
protos = { git = "https://github.com/LiGoldragon/protos", rev = "15b41da8f2579e73ead59bc0c2b97529b8ac32d3" }
signal-lojix = { git = "https://github.com/LiGoldragon/signal-lojix", rev = "0a83f2d6d89b473ce63ff10bf05982df314894ad" }
tempfile = "3"
