[package]
name = "lojix-offline-tools"
version = "0.11.0"
edition = "2024"
rust-version = "1.89"
publish = false

[[bin]]
name = "lojix-inspect-store"
path = "src/lojix-inspect-store.rs"

[[bin]]
name = "lojix-reset-store"
path = "src/lojix-reset-store.rs"

[[bin]]
name = "lojix-bootstrap"
path = "src/lojix-bootstrap.rs"

[dependencies]
lojix = { path = "..", features = ["tools"] }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
signal-lojix = { git = "https://github.com/LiGoldragon/signal-lojix", rev = "17c23e2ef85afdb2834b546442d3020c204d14f9" }
tempfile = "3"
