[package]
name = "lojix-offline-tools"
version = "0.10.7"
edition = "2024"
rust-version = "1.89"
publish = false

[[bin]]
name = "lojix-write-configuration"
path = "src/lojix-write-configuration.rs"

[[bin]]
name = "lojix-inspect-store"
path = "src/lojix-inspect-store.rs"

[[bin]]
name = "lojix-reset-store"
path = "src/lojix-reset-store.rs"

[[bin]]
name = "lojix-migrate-configuration"
path = "src/lojix-migrate-configuration.rs"

[[bin]]
name = "lojix-bootstrap"
path = "src/lojix-bootstrap.rs"

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "eb792265a67b2c6865f9b8c9ed9d2e5ae5a7174c" }
horizon-lib = { git = "https://github.com/LiGoldragon/horizon-rs", rev = "825a7f09242380a7b3d2609b26e20647db46a8ce", package = "horizon-lib" }
lojix = { path = "..", features = ["tools"] }
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
protos = { git = "https://github.com/LiGoldragon/protos", rev = "15b41da8f2579e73ead59bc0c2b97529b8ac32d3" }
signal-lojix = { git = "https://github.com/LiGoldragon/signal-lojix", rev = "8a776198db368c7f5d39e1615c3d3d319fc2cf5d" }
tempfile = "3"
