[package]
name         = "lojix"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.88"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/lojix"
description  = "Long-lived deploy orchestrator daemon (`lojix-daemon`) + thin CLI client (`lojix`) for the criome cluster."
publish      = false

[lib]
name = "lojix"
path = "src/lib.rs"

[[bin]]
name = "lojix-daemon"
path = "src/bin/lojix-daemon.rs"

[[bin]]
name = "lojix"
path = "src/bin/lojix.rs"

[dependencies]
# Wire kernel — Frame, handshake, SignalVerb, channel macro.
signal-core  = { git = "https://github.com/LiGoldragon/signal-core.git" }

# Lojix wire vocabulary (Request/Reply, deploy/cache-retention/generation
# records). Tracks this feature branch alongside this crate.
signal-lojix = { git = "https://github.com/LiGoldragon/signal-lojix.git", branch = "horizon-leaner-shape" }

# Criome authorization vocabulary. The daemon gates deploy effects on
# Criome authorization over the canonical signal-lojix request digest.
signal-criome = { git = "https://github.com/LiGoldragon/signal-criome.git", branch = "main" }

# Typed database engine (registered record families, Assert/Mutate/Match/
# Subscribe/commit/Validate). The daemon owns one redb file via Engine.
sema-engine  = { git = "https://github.com/LiGoldragon/sema-engine.git", branch = "main" }
sema         = { git = "https://github.com/LiGoldragon/sema.git" }

# Horizon projection library — projects cluster proposals before build.
horizon-lib  = { git = "https://github.com/LiGoldragon/horizon-rs.git", branch = "horizon-leaner-shape", package = "horizon-lib" }
horizon-nota-codec = { package = "nota-codec", git = "https://github.com/LiGoldragon/nota-codec.git" }

# Text codec for the CLI's nota-in / nota-out boundary.
nota-codec   = { git = "https://github.com/LiGoldragon/nota-codec.git", branch = "main" }

# Typed startup configuration boundary for production binaries.
nota-config  = { git = "https://github.com/LiGoldragon/nota-config.git", branch = "main" }

# Wire-format derives shared with signal-core / signal-lojix.
rkyv         = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }

# Unix socket ownership and group lookup.
nix          = { version = "0.30", features = ["fs", "user"] }

# Crate-typed errors (per skills/rust/errors.md).
thiserror    = "2"

# JSON materialization for generated horizon input flakes.
serde_json   = "1"

# Actor framework (per skills/actor-systems.md and skills/kameo.md).
kameo        = "0.20"

# Async runtime hosting kameo + Unix socket I/O.
tokio        = { version = "1", features = ["full"] }

[dev-dependencies]
# tokio is already a dependency; tests reuse the same runtime.

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
