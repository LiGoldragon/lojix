[package]
name         = "lojix"
version      = "0.11.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
description  = "lojix deploy orchestrator daemon and thin CLI."
publish      = false

[workspace]
members = [".", "nexus", "clients/ordinary", "clients/meta", "tools"]
resolver = "3"

[features]
default = ["tools"]
# The generated ingress derives its datom kinds under `datom`, as
# ethos-zero 29 emits them; the offline tools read datom text, so `tools`
# carries it. The Nexus builds with neither.
datom = ["dep:datom-codec", "dep:protos"]
tools = [
  "datom",
  "horizon-lib/datom",
  "meta-signal-lojix/datom",
  "signal-lojix/datom",
]

[lib]
name = "lojix"
path = "src/lib.rs"

[dependencies]
horizon-lib       = { git = "https://github.com/LiGoldragon/horizon-rs", rev = "182f5307962896e95a2a83c45f68785b1f7c84d3", package = "horizon-lib", default-features = false }
datom-codec       = { git = "https://github.com/LiGoldragon/datom-codec", rev = "eb792265a67b2c6865f9b8c9ed9d2e5ae5a7174c", optional = true }
protos            = { git = "https://github.com/LiGoldragon/protos", rev = "15b41da8f2579e73ead59bc0c2b97529b8ac32d3", optional = true }
kameo             = "0.20"
nexus             = { git = "https://github.com/LiGoldragon/nexus", rev = "64a735db884cbbb86fe492ec16b7dd7a2d492b4e" }
meta-signal-lojix = { git = "https://github.com/LiGoldragon/meta-signal-lojix", rev = "7fe43b82e29631db9d5cf266db594a51c61bc9eb" }
signal-lojix      = { git = "https://github.com/LiGoldragon/signal-lojix", rev = "17c23e2ef85afdb2834b546442d3020c204d14f9" }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "f35460de930943ea1a8a972453ccf3a092a655b5", default-features = false, features = ["transport"] }
rkyv              = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
redb              = "4"
rustix            = { version = "1", default-features = false, features = ["fs", "process"] }
memory-engine       = { git = "https://github.com/LiGoldragon/memory-engine.git", rev = "27f256c39de975e6c1b5533506a926cdb51a288c" }
serde_json        = "1"
sha2              = "0.10"
thiserror         = "2"
tokio             = { version = "1", features = ["io-util", "process", "rt-multi-thread", "signal", "sync", "time"] }
triad-runtime     = { git = "https://github.com/LiGoldragon/triad-runtime.git", rev = "4cc0a100841d2400f354c008c9faa73b2cedf50e" }
futures-util      = "0.3"
zbus              = "4.4"

[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "f23eacf338a90ce4a6dea011554724fa6488fcc9" }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"

[lints.clippy]
# Actor messages and generated ingress preserve their authored typed payloads;
# the archived wire model supplies indirection without changing their shapes.
large_enum_variant = "allow"

# One kameo in the closure, taken from crates.io. `triad-runtime` names the
# LiGoldragon fork by rev; it uses only upstream 0.20 API (`ActorRef`,
# `Infallible`, `message`, `Reply`, `DelegatedReply`), so redirecting that git
# source to the published crate collapses the two incompatible copies whose
# `Actor`/`ActorRef` types were not interchangeable.
[patch."https://github.com/LiGoldragon/kameo.git"]
kameo = "0.20"
kameo_macros = "0.20"
