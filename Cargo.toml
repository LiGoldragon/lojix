[package]
name         = "lojix"
version      = "3.0.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
description  = "lojix deploy orchestrator daemon and thin CLI."
publish      = false

[workspace]
members = [".", "nexus", "clients/ordinary", "clients/meta", "tools"]
resolver = "3"

[features]
default = ["tools"]
tools = [
  "dep:datom-codec",
  "dep:protos",
  "horizon-lib/datom",
  "meta-signal-lojix/datom",
  "signal-lojix/datom",
]

[lib]
name = "lojix"
path = "src/lib.rs"

[dependencies]
horizon-lib       = { git = "https://github.com/LiGoldragon/horizon-rs", rev = "a56330451934d682ae15612acd49924356ec0205", package = "horizon-lib", default-features = false }
datom-codec       = { git = "https://github.com/LiGoldragon/datom-codec", rev = "99a9e8c9cbdb88650cc2511644b89428c22129e2", optional = true }
protos            = { git = "https://github.com/LiGoldragon/protos", rev = "b543678cfc8609529cea7174eb4af8a64daa54ad", optional = true }
kameo             = "0.20"
nexus             = { git = "https://github.com/LiGoldragon/nexus", rev = "a84bfa960c0d5c02d30048c4bbbc67dfef79a67c" }
meta-signal-lojix = { git = "https://github.com/LiGoldragon/meta-signal-lojix", rev = "1eccc0e3d314a5d92c741959a698697c37ec0eac" }
signal-lojix      = { git = "https://github.com/LiGoldragon/signal-lojix", rev = "d0f5c70d437add1df16055dcb760b7ef9a140ef0" }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "626e407be520a7a12f39b1d06c56ec423f3b3d09", default-features = false, features = ["transport"] }
rkyv              = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
redb              = "4"
rustix            = { version = "1", default-features = false, features = ["fs", "process"] }
sema-engine       = { git = "https://github.com/LiGoldragon/sema-engine.git", rev = "27e814a721439af67721c530d48b4d2101141f74" }
serde_json        = "1"
sha2              = "0.10"
thiserror         = "2"
tokio             = { version = "1", features = ["io-util", "process", "rt-multi-thread", "signal", "sync", "time"] }
triad-runtime     = { git = "https://github.com/LiGoldragon/triad-runtime.git", rev = "02cdd49df63a1769b3cf1b2761261a87eeaa75a4" }
futures-util      = "0.3"
zbus              = "4.4"

[dev-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "4695ee0c1f5d00dcf5cceba08f5fa00412b92184" }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"

[lints.clippy]
# Actor messages and generated ingress preserve their authored typed payloads;
# the archived wire model supplies indirection without changing their shapes.
large_enum_variant = "allow"

# One kameo in the closure, taken from crates.io. `triad-runtime` names the
# LiGoldragon fork by rev; it uses only upstream 0.20 API (`ActorRef`,
# `Infallible`, `message`, `Reply`, `DelegatedReply`), so redirecting that git
# source to the published crate collapses the two incompatible copies whose
# `Actor`/`ActorRef` types were not interchangeable.
[patch."https://github.com/LiGoldragon/kameo.git"]
kameo = "0.20"
kameo_macros = "0.20"
