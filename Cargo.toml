[package]
name         = "lojix"
version      = "0.20.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
description  = "lojix deploy orchestrator daemon and thin CLI."
publish      = false

[lib]
name = "lojix"
path = "src/lib.rs"

[[bin]]
name = "lojix-daemon"
path = "src/bin/lojix-daemon.rs"

[[bin]]
name = "lojix"
path = "src/bin/lojix.rs"

[[bin]]
name = "meta-lojix"
path = "src/bin/meta-lojix.rs"

[[bin]]
name = "lojix-write-configuration"
path = "src/bin/lojix-write-configuration.rs"

[[bin]]
name = "lojix-inspect-store"
path = "src/bin/lojix-inspect-store.rs"

[[bin]]
name = "lojix-reset-store"
path = "src/bin/lojix-reset-store.rs"

[[bin]]
name = "lojix-bootstrap"
path = "src/bin/lojix-bootstrap.rs"
required-features = ["dotos-text"]

[features]
default   = []
dotos-text = ["signal-lojix/dotos-text", "meta-signal-lojix/dotos-text"]

[dependencies]
horizon-lib       = { git = "https://github.com/LiGoldragon/horizon-rs.git", rev = "f8c5808466a47c2fd741cf0b119d73e8ba2add3d" }
datomic           = { git = "https://github.com/LiGoldragon/datomic.git", rev = "b670c72d0c2cb94ad1e39b372271f6569d91e214" }
protos            = { git = "https://github.com/LiGoldragon/protos.git", rev = "bfde3b878dd3de2991d7f605b59f57a13ef8f20b" }
kameo             = "0.20"
dotos        = { package = "dotos", git = "https://github.com/LiGoldragon/dotos.git", rev = "b3c2c76fe7a18ba026ab054d1fa7162e55860b9e" }
meta-signal-lojix = { git = "https://github.com/LiGoldragon/meta-signal-lojix.git", rev = "45c51112824b487ae3a8e3e5b05cd372b6619481" }
signal-lojix      = { git = "https://github.com/LiGoldragon/signal-lojix.git", rev = "50c4fab3f8a2b16aa1261104395f1dae315035d1" }
signal-frame      = { git = "https://github.com/LiGoldragon/signal-frame.git", rev = "80f70d929ae6d72707052f097be2264872913983", default-features = false }
rkyv              = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
redb              = "4"
rustix            = { version = "1", default-features = false, features = ["fs", "process"] }
sema-engine       = { git = "https://github.com/LiGoldragon/sema-engine.git", branch = "main" }
serde_json        = "1"
sha2              = "0.10"
thiserror         = "2"
tokio             = { version = "1", features = ["io-util", "process", "rt-multi-thread", "signal", "sync", "time"] }
triad-runtime     = { git = "https://github.com/LiGoldragon/triad-runtime.git", branch = "main" }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
