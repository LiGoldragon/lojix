[package]
name         = "lojix"
version      = "0.10.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
description  = "lojix deploy orchestrator daemon and thin CLI."
publish      = false

[lib]
name = "lojix"
path = "src/lib.rs"

[[bin]]
name = "lojix-daemon"
path = "src/bin/lojix-daemon.rs"

[[bin]]
name = "lojix"
path = "src/bin/lojix.rs"

[[bin]]
name = "meta-lojix"
path = "src/bin/meta-lojix.rs"

[[bin]]
name = "lojix-write-configuration"
path = "src/bin/lojix-write-configuration.rs"

[[bin]]
name = "lojix-inspect-store"
path = "src/bin/lojix-inspect-store.rs"

[[bin]]
name = "lojix-reconstruct-schema-one"
path = "src/bin/lojix-reconstruct-schema-one.rs"

[[bin]]
name = "lojix-post-activation-ledger"
path = "src/bin/lojix-post-activation-ledger.rs"

[features]
default   = []
nota-text = ["signal-lojix/nota-text", "meta-signal-lojix/nota-text"]

[dependencies]
horizon-lib       = { git = "https://github.com/LiGoldragon/horizon-rs.git", rev = "a6300bccc4b6" }
kameo             = { git = "https://github.com/LiGoldragon/kameo.git", rev = "f491b45d" }
nota         = { git = "https://github.com/LiGoldragon/nota.git", rev = "f8de7a516b769fc544c7f8c0030e258833c1cf9b" }
meta-signal-lojix = { git = "https://github.com/LiGoldragon/meta-signal-lojix.git", rev = "904d1969313994ee36ebb688c07fc095fdc66b01" }
signal-lojix      = { git = "https://github.com/LiGoldragon/signal-lojix.git", rev = "8893cd4bb239fec87d23ae145ea751893050a8a1" }
rkyv              = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
redb              = "4"
rustix            = { version = "1", default-features = false, features = ["process"] }
sema-engine       = { git = "https://github.com/LiGoldragon/sema-engine.git", rev = "653a44b7dcd3d0de9e6b9358d1806413680eda67" }
serde_json        = "1"
thiserror         = "2"
tokio             = { version = "1", features = ["process", "rt-multi-thread", "sync", "time"] }
triad-runtime     = { git = "https://github.com/LiGoldragon/triad-runtime.git", rev = "d93ad0d08e46" }

[build-dependencies]
schema-rust = { git = "https://github.com/LiGoldragon/schema-rust.git", rev = "ab366e40135992ef1f73791153b70b9c6ed0a972" }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
