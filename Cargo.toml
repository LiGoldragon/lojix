[package]
name         = "lojix"
version      = "0.21.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
description  = "lojix deploy orchestrator daemon and thin CLI."
publish      = false

[lib]
name = "lojix"
path = "src/lib.rs"

[[bin]]
name = "lojix-daemon"
path = "src/bin/lojix-daemon.rs"

[[bin]]
name = "lojix"
path = "src/bin/lojix.rs"

[[bin]]
name = "meta-lojix"
path = "src/bin/meta-lojix.rs"

[[bin]]
name = "lojix-write-configuration"
path = "src/bin/lojix-write-configuration.rs"

[[bin]]
name = "lojix-inspect-store"
path = "src/bin/lojix-inspect-store.rs"

[[bin]]
name = "lojix-reset-store"
path = "src/bin/lojix-reset-store.rs"

[[bin]]
name = "lojix-bootstrap"
path = "src/bin/lojix-bootstrap.rs"

[dependencies]
horizon-lib       = { git = "https://github.com/LiGoldragon/horizon-rs.git", rev = "05879e7c1e5f637f78fbe26234b95213c77c59bc" }
datom-codec       = { git = "https://github.com/LiGoldragon/datom-codec", rev = "41a3c073d5c5" }
protos            = { git = "https://github.com/LiGoldragon/protos", rev = "2d999f173334" }
kameo             = "0.20"
meta-signal-lojix = { git = "https://github.com/LiGoldragon/meta-signal-lojix.git", rev = "c152ce07c6174c76d929f3fde323a2a79a53c49c" }
signal-lojix      = { git = "https://github.com/LiGoldragon/signal-lojix.git", rev = "4f50413c93cff97ab8ce7b78595218f79c8794e4" }
signal-frame      = { git = "https://github.com/LiGoldragon/signal-frame.git", rev = "80f70d929ae6d72707052f097be2264872913983", default-features = false }
rkyv              = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
redb              = "4"
rustix            = { version = "1", default-features = false, features = ["fs", "process"] }
sema-engine       = { git = "https://github.com/LiGoldragon/sema-engine.git", branch = "main" }
serde_json        = "1"
sha2              = "0.10"
thiserror         = "2"
tokio             = { version = "1", features = ["io-util", "process", "rt-multi-thread", "signal", "sync", "time"] }
triad-runtime     = { git = "https://github.com/LiGoldragon/triad-runtime.git", branch = "main" }
futures-util      = "0.3"
zbus              = "4.4"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
