[package]
name         = "lojix"
version      = "0.8.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
description  = "lojix deploy orchestrator daemon and thin CLI."
publish      = false

[lib]
name = "lojix"
path = "src/lib.rs"

[[bin]]
name = "lojix-daemon"
path = "src/bin/lojix-daemon.rs"

[[bin]]
name = "lojix"
path = "src/bin/lojix.rs"

[[bin]]
name = "meta-lojix"
path = "src/bin/meta-lojix.rs"

[[bin]]
name = "lojix-write-configuration"
path = "src/bin/lojix-write-configuration.rs"

[[bin]]
name = "lojix-inspect-store"
path = "src/bin/lojix-inspect-store.rs"

[features]
default   = []
nota-text = ["signal-lojix/nota-text", "meta-signal-lojix/nota-text"]

[dependencies]
horizon-lib       = { git = "https://github.com/LiGoldragon/horizon-rs.git", rev = "a6300bccc4b6" }
kameo             = "0.20"
nota         = { git = "https://github.com/LiGoldragon/nota.git", rev = "f8de7a516b769fc544c7f8c0030e258833c1cf9b" }
meta-signal-lojix = { git = "https://github.com/LiGoldragon/meta-signal-lojix.git", rev = "35510c008418" }
signal-lojix      = { git = "https://github.com/LiGoldragon/signal-lojix.git", rev = "3c96c5c06563" }
rkyv              = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
redb              = "4"
rustix            = { version = "1", default-features = false, features = ["process"] }
sema-engine       = { git = "https://github.com/LiGoldragon/sema-engine.git", rev = "c56c905d2cec24b9b41a62ed7b8bc847b33be533" }
serde_json        = "1"
thiserror         = "2"
tokio             = { version = "1", features = ["process", "rt-multi-thread", "sync", "time"] }
triad-runtime     = { git = "https://github.com/LiGoldragon/triad-runtime.git", branch = "main" }

[build-dependencies]
schema-rust = { git = "https://github.com/LiGoldragon/schema-rust.git", rev = "51a65c4b241f" }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
