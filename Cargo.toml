[package]
name         = "lojix"
version      = "8.1.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
description  = "lojix deploy orchestrator daemon and thin CLI."
publish      = false

[workspace]
members = [".", "nexus", "clients/ordinary", "clients/meta", "tools"]
resolver = "3"

[features]
default = ["tools"]
tools = [
  "dep:datom-codec",
  "dep:protos",
  "horizon-lib/datom",
  "meta-signal-lojix/datom",
  "signal-lojix/datom",
]

[lib]
name = "lojix"
path = "src/lib.rs"

[dependencies]
horizon-lib       = { git = "https://github.com/LiGoldragon/horizon-rs", rev = "a3ddaf8685b920093a2328b85ba350a04e11477a", package = "horizon-lib", default-features = false }
datom-codec       = { git = "https://github.com/LiGoldragon/datom-codec", rev = "4dff16b4f7412febc3b71aac8b49680cd20988cb", optional = true }
protos            = { git = "https://github.com/LiGoldragon/protos", rev = "15b41da8f2579e73ead59bc0c2b97529b8ac32d3", optional = true }
kameo             = "0.20"
nexus             = { git = "https://github.com/LiGoldragon/nexus", rev = "a84bfa960c0d5c02d30048c4bbbc67dfef79a67c" }
meta-signal-lojix = { git = "https://github.com/LiGoldragon/meta-signal-lojix", rev = "c0f883c5cc428ce94ffa109fa20a5a28f7902481" }
signal-lojix      = { git = "https://github.com/LiGoldragon/signal-lojix", rev = "cd164896311af9849e2ddf1cdbdd35b5feedcdd1" }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "8f9a0deb701cebbea518679548df4a795affc918", default-features = false, features = ["transport"] }
rkyv              = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
redb              = "4"
rustix            = { version = "1", default-features = false, features = ["fs", "process"] }
sema-engine       = { git = "https://github.com/LiGoldragon/sema-engine.git", rev = "27e814a721439af67721c530d48b4d2101141f74" }
serde_json        = "1"
sha2              = "0.10"
thiserror         = "2"
tokio             = { version = "1", features = ["io-util", "process", "rt-multi-thread", "signal", "sync", "time"] }
triad-runtime     = { git = "https://github.com/LiGoldragon/triad-runtime.git", rev = "02cdd49df63a1769b3cf1b2761261a87eeaa75a4" }
futures-util      = "0.3"
zbus              = "4.4"

[dev-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "c2653dd82adbdb1f1f2f654405c6620e0d06fd58" }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"

[lints.clippy]
# Actor messages and generated ingress preserve their authored typed payloads;
# the archived wire model supplies indirection without changing their shapes.
large_enum_variant = "allow"

# One kameo in the closure, taken from crates.io. `triad-runtime` names the
# LiGoldragon fork by rev; it uses only upstream 0.20 API (`ActorRef`,
# `Infallible`, `message`, `Reply`, `DelegatedReply`), so redirecting that git
# source to the published crate collapses the two incompatible copies whose
# `Actor`/`ActorRef` types were not interchangeable.
[patch."https://github.com/LiGoldragon/kameo.git"]
kameo = "0.20"
kameo_macros = "0.20"
