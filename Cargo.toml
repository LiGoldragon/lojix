[package]
name         = "lojix"
version      = "2.0.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
description  = "lojix deploy orchestrator daemon and thin CLI."
publish      = false

[workspace]
members = [".", "nexus", "clients/ordinary", "clients/meta", "tools"]
resolver = "3"

[features]
default = ["tools"]
tools = [
  "dep:datom-codec",
  "dep:protos",
  "horizon-lib/datom",
  "meta-signal-lojix/datom",
  "signal-lojix/datom",
]

[lib]
name = "lojix"
path = "src/lib.rs"

[dependencies]
horizon-lib       = { git = "https://github.com/LiGoldragon/horizon-rs", rev = "8f4240ef23024c2d3b55f803d96d3c6e7aa5b433", package = "horizon-lib", default-features = false }
datom-codec       = { git = "https://github.com/LiGoldragon/datom-codec", rev = "99a9e8c9cbdb88650cc2511644b89428c22129e2", optional = true }
protos            = { git = "https://github.com/LiGoldragon/protos", rev = "b543678cfc8609529cea7174eb4af8a64daa54ad", optional = true }
kameo             = "0.20"
nexus             = { git = "https://github.com/LiGoldragon/nexus", rev = "a84bfa960c0d5c02d30048c4bbbc67dfef79a67c" }
meta-signal-lojix = { git = "https://github.com/LiGoldragon/meta-signal-lojix", rev = "f7f11d410d68cc6843ad217a8b1ea715a5645912" }
signal-lojix      = { git = "https://github.com/LiGoldragon/signal-lojix", rev = "662cedb7d92b76e01eb689bf3b7945c5db003bc2" }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "626e407be520a7a12f39b1d06c56ec423f3b3d09", default-features = false, features = ["transport"] }
rkyv              = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
redb              = "4"
rustix            = { version = "1", default-features = false, features = ["fs", "process"] }
sema-engine       = { git = "https://github.com/LiGoldragon/sema-engine.git", branch = "main" }
serde_json        = "1"
sha2              = "0.10"
thiserror         = "2"
tokio             = { version = "1", features = ["io-util", "process", "rt-multi-thread", "signal", "sync", "time"] }
triad-runtime     = { git = "https://github.com/LiGoldragon/triad-runtime.git", branch = "main" }
futures-util      = "0.3"
zbus              = "4.4"

[dev-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "4695ee0c1f5d00dcf5cceba08f5fa00412b92184" }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"

[lints.clippy]
# Actor messages and generated ingress preserve their authored typed payloads;
# the archived wire model supplies indirection without changing their shapes.
large_enum_variant = "allow"
