[package]
name         = "lojix"
version      = "0.16.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
description  = "lojix deploy orchestrator daemon and thin CLI."
publish      = false

[lib]
name = "lojix"
path = "src/lib.rs"

[[bin]]
name = "lojix-daemon"
path = "src/bin/lojix-daemon.rs"

[[bin]]
name = "lojix"
path = "src/bin/lojix.rs"

[[bin]]
name = "meta-lojix"
path = "src/bin/meta-lojix.rs"

[[bin]]
name = "lojix-write-configuration"
path = "src/bin/lojix-write-configuration.rs"

[[bin]]
name = "lojix-inspect-store"
path = "src/bin/lojix-inspect-store.rs"

[[bin]]
name = "lojix-reset-store"
path = "src/bin/lojix-reset-store.rs"

[features]
default   = []
dotos-text = ["signal-lojix/dotos-text", "meta-signal-lojix/dotos-text"]

[dependencies]
horizon-lib       = { git = "https://github.com/LiGoldragon/horizon-rs.git", rev = "c62b38193cd482d31a88dc5633de4cda32beb3f3" }
kameo             = "0.20"
dotos        = { package = "dotos", git = "https://github.com/LiGoldragon/dotos.git", rev = "80c7b17f7ad3cf547d2624c6a243e5de5f85c9f3" }
meta-signal-lojix = { git = "https://github.com/LiGoldragon/meta-signal-lojix.git", rev = "cdacac7efc0db04d12bc61cbf9248696fb568ce3" }
signal-lojix      = { git = "https://github.com/LiGoldragon/signal-lojix.git", rev = "0f04aa048049937a07b98c87584e3591114986bb" }
signal-frame      = { git = "https://github.com/LiGoldragon/signal-frame.git", rev = "01676293a623d97b65e320d4138c4b480c6d5dad", default-features = false }
rkyv              = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
redb              = "4"
rustix            = { version = "1", default-features = false, features = ["fs", "process"] }
sema-engine       = { git = "https://github.com/LiGoldragon/sema-engine.git", branch = "main" }
serde_json        = "1"
thiserror         = "2"
tokio             = { version = "1", features = ["io-util", "process", "rt-multi-thread", "sync", "time"] }
triad-runtime     = { git = "https://github.com/LiGoldragon/triad-runtime.git", branch = "main" }

[build-dependencies]
schema-rust = { git = "https://github.com/LiGoldragon/schema-rust.git", rev = "ee9e287c313684e8fd5c651c69ad04a1fa9624b8" }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
