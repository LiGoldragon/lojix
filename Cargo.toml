[package]
name         = "lojix"
version      = "0.3.10"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
description  = "lojix deploy orchestrator daemon and thin CLI."
publish      = false

[lib]
name = "lojix"
path = "src/lib.rs"

[[bin]]
name = "lojix-daemon"
path = "src/bin/lojix-daemon.rs"

[[bin]]
name = "lojix"
path = "src/bin/lojix.rs"

[[bin]]
name = "meta-lojix"
path = "src/bin/meta-lojix.rs"

[[bin]]
name = "lojix-write-configuration"
path = "src/bin/lojix-write-configuration.rs"

[features]
default   = []
nota-text = ["signal-lojix/nota-text", "meta-signal-lojix/nota-text"]

[dependencies]
criome            = { git = "https://github.com/LiGoldragon/criome.git", branch = "main" }
horizon-lib       = { git = "https://github.com/LiGoldragon/horizon-rs.git", branch = "main" }
kameo             = "0.20"
nota-next         = { git = "https://github.com/LiGoldragon/nota-next.git", branch = "main" }
meta-signal-lojix = { git = "https://github.com/LiGoldragon/meta-signal-lojix.git", branch = "system-operator-contained-test-poc" }
signal-lojix      = { git = "https://github.com/LiGoldragon/signal-lojix.git", branch = "system-operator-contained-test-poc" }
signal-criome     = { git = "https://github.com/LiGoldragon/signal-criome.git", branch = "main" }
rkyv              = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
rustix            = { version = "1", default-features = false, features = ["process"] }
sema-engine       = { git = "https://github.com/LiGoldragon/sema-engine.git", branch = "main" }
serde_json        = "1"
thiserror         = "2"
tokio             = { version = "1", features = ["process", "rt-multi-thread", "sync", "time"] }
triad-runtime     = { git = "https://github.com/LiGoldragon/triad-runtime.git", branch = "main" }

[build-dependencies]
schema-rust-next = { git = "https://github.com/LiGoldragon/schema-rust-next.git", branch = "system-operator-contained-test-poc" }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
