[package]
name = "meta-lojix-client"
version = "9.0.0"
edition = "2024"
rust-version = "1.89"
publish = false

[[bin]]
name = "lojix-meta"
path = "src/main.rs"

[dependencies]
lojix = { path = "../..", default-features = false }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09e2a9d52bf7f2f11e51d15cb6c3177f72c6c927" }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "1febca7836bf8d5f5973a302fdd50aa9c84c159b" }
meta-signal-lojix = { git = "https://github.com/LiGoldragon/meta-signal-lojix", rev = "c0eee6dc6c21d74785c8293fcc59d9692fcce97b", features = ["datom"] }
signal-lojix = { git = "https://github.com/LiGoldragon/signal-lojix", rev = "c22af7453ebaf717f491efd70e70a79c53c7ae16" }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "8f9a0deb701cebbea518679548df4a795affc918", default-features = false }
horizon-lib = { git = "https://github.com/LiGoldragon/horizon-rs", rev = "12b2a25bcbad08ebcbac6d1fc25821de3008908d", package = "horizon-lib" }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
tempfile = "3"
