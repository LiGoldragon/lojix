[package]
name = "lojix-client"
version = "1.0.1"
edition = "2024"
rust-version = "1.89"
publish = false

[[bin]]
name = "lojix"
path = "src/main.rs"

[dependencies]
lojix = { path = "../..", default-features = false }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "f2cc06858d38a4028c928d33323a6d682e7c222f" }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "b543678cfc8609529cea7174eb4af8a64daa54ad" }
signal-lojix = { git = "https://github.com/LiGoldragon/signal-lojix", rev = "79b43f3fdfb787535dd23ca1a83a406724de1790", features = ["datom"] }

[lints.rust]
unsafe_code = "forbid"
