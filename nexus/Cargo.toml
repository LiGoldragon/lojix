[package]
name = "lojix-nexus"
version = "1.0.1"
edition = "2024"
rust-version = "1.89"
publish = false

[[bin]]
name = "lojix-nexus"
path = "src/main.rs"

[dependencies]
lojix = { path = "..", default-features = false }

[dev-dependencies]
meta-signal-lojix = { git = "https://github.com/LiGoldragon/meta-signal-lojix", rev = "ea103304602fb149717d40517c6f6611a5e8c2bf" }
signal-lojix = { git = "https://github.com/LiGoldragon/signal-lojix", rev = "e7067832dec3a446e023aa8196431fe174f46c84" }
tempfile = "3"
triad-runtime = { git = "https://github.com/LiGoldragon/triad-runtime.git", branch = "main" }
rustix = { version = "1", default-features = false, features = ["process"] }

[lints.rust]
unsafe_code = "forbid"
