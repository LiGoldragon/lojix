[package]
name = "lojix-nexus"
version = "0.10.5"
edition = "2024"
rust-version = "1.89"
publish = false

[[bin]]
name = "lojix-nexus"
path = "src/main.rs"

[dependencies]
lojix = { path = "..", default-features = false }

[dev-dependencies]
meta-signal-lojix = { git = "https://github.com/LiGoldragon/meta-signal-lojix", rev = "97ae0c7e9dc48b4e9ecf87c3138095fae8c3800a" }
signal-lojix = { git = "https://github.com/LiGoldragon/signal-lojix", rev = "ba4d4ac9fa0d189e78c912be8bb188b3b529c071" }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "f35460de930943ea1a8a972453ccf3a092a655b5", default-features = false }
tempfile = "3"
redb = "4"
triad-runtime = { git = "https://github.com/LiGoldragon/triad-runtime.git", rev = "02cdd49df63a1769b3cf1b2761261a87eeaa75a4" }
rustix = { version = "1", default-features = false, features = ["process"] }

[lints.rust]
unsafe_code = "forbid"
