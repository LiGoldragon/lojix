[package]
name = "lojix-nexus"
version = "0.10.1"
edition = "2024"
rust-version = "1.89"
publish = false

[[bin]]
name = "lojix-nexus"
path = "src/main.rs"

[dependencies]
lojix = { path = "..", default-features = false }

[dev-dependencies]
meta-signal-lojix = { git = "https://github.com/LiGoldragon/meta-signal-lojix", rev = "a26bd30a6acce7520f1681bb7746cc518a07cb59" }
signal-lojix = { git = "https://github.com/LiGoldragon/signal-lojix", rev = "a55516571f7fa58aca92c973738d1788b6bd3604" }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "f35460de930943ea1a8a972453ccf3a092a655b5", default-features = false }
tempfile = "3"
redb = "4"
triad-runtime = { git = "https://github.com/LiGoldragon/triad-runtime.git", rev = "02cdd49df63a1769b3cf1b2761261a87eeaa75a4" }
rustix = { version = "1", default-features = false, features = ["process"] }

[lints.rust]
unsafe_code = "forbid"
